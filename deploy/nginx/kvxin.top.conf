server {
    listen 80;
    server_name kvxin.top www.kvxin.top;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name kvxin.top www.kvxin.top;
    root /www/blog-data/releases/current;
    index index.html;

    include /www/server/panel/vhost/nginx/extension/kvxin.top/*.conf;
    ssl_certificate /www/server/panel/vhost/cert/kvxin.top/full_chain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/kvxin.top/cert.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:HIGH:!aNULL:!MD5:!RC4:!DHE;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    access_log /www/wwwlogs/kvxin.top.log;
    error_log /www/wwwlogs/kvxin.top.error.log;

    # One origin for authenticated administration; public blog works on both hosts.
    location = /admin { return 301 https://kvxin.top/admin/; }
    location /admin/assets/ {
        if ($host = www.kvxin.top) { return 301 https://kvxin.top$request_uri; }
        alias /workspace/blog/apps/admin/dist/assets/;
        add_header Cache-Control "no-cache";
    }
    location /admin/ {
        if ($host = www.kvxin.top) { return 301 https://kvxin.top$request_uri; }
        alias /workspace/blog/apps/admin/dist/;
        try_files $uri $uri/ /admin/index.html;
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location = /api/media/upload {
        if ($host = www.kvxin.top) { return 308 https://kvxin.top$request_uri; }
        client_max_body_size 11m;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 135s;
    }
    location /api/ {
        if ($host = www.kvxin.top) { return 308 https://kvxin.top$request_uri; }
        client_max_body_size 2m;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 135s;
    }

    location = /release.json { return 404; }
    location / { try_files $uri $uri/index.html =404; add_header Cache-Control "no-cache"; }
    location ~ /\. { deny all; }
}
