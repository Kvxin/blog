server {
    listen 4321;
    server_name 1.117.61.219;
    root /www/blog-data/releases/current;
    index index.html;

    access_log /www/wwwlogs/blog.access.log;
    error_log /www/wwwlogs/blog.error.log;

    location = / { return 302 /blog/; }
    location = /blog { return 301 /blog/; }
    location /blog/ {
        rewrite ^/blog/(.*)$ /$1 break;
        try_files $uri $uri/index.html =404;
        add_header Cache-Control "no-cache";
    }

    location = /admin { return 301 /admin/; }
    location /admin/assets/ {
        alias /workspace/blog/apps/admin/dist/assets/;
        add_header Cache-Control "no-cache";
    }
    location /admin/ {
        alias /workspace/blog/apps/admin/dist/;
        try_files $uri $uri/ /admin/index.html;
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # Every business route is protected by the API's session/CSRF guard.
    location = /api/media/upload {
        client_max_body_size 11m;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 90s;
    }
    location /api/ {
        client_max_body_size 2m;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 135s;
    }
    location / { return 404; }
    location ~ /\. { deny all; }
}
